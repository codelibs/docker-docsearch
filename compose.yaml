services:
  fess01:
    image: ghcr.io/codelibs/fess:15.8.0
    container_name: fess01
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      search01:
        condition: service_healthy
    environment:
      SEARCH_ENGINE_HTTP_URL: "http://search01:9200"
      FESS_DICTIONARY_PATH: "/usr/share/opensearch/config/dictionary/"
      # fess_config.properties overrides. Dynamic system settings live in the
      # mounted data/fess/opt/fess/system.properties (see bin/setup.sh).
      FESS_JAVA_OPTS: >-
        -Dfess.config.crawler.document.cache.enabled=false
        -Dfess.config.adaptive.load.control=20
        -Dfess.config.query.facet.fields=label,host
    networks:
      - docsearch_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./data/fess/opt/fess:/opt/fess
      - ./data/fess/var/lib/fess:/var/lib/fess
      - ./data/fess/var/log/fess:/var/log/fess
      - ./data/fess/usr/share/fess/app/WEB-INF/plugin:/usr/share/fess/app/WEB-INF/plugin
      - ./data/fess/usr/share/fess/app/themes/docsearch:/usr/share/fess/app/themes/docsearch

  search01:
    image: ghcr.io/codelibs/fess-opensearch:3.8.0
    container_name: search01
    restart: always
    environment:
      - node.name=search01
      - discovery.seed_hosts=search01
      - cluster.initial_cluster_manager_nodes=search01
      - cluster.name=fess-search
      - bootstrap.memory_lock=true
      - node.roles=cluster_manager,data,ingest,ml
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - ./data/opensearch/usr/share/opensearch/data:/usr/share/opensearch/data
      - ./data/opensearch/usr/share/opensearch/config/dictionary:/usr/share/opensearch/config/dictionary
    # No host port is published for the search engine. The security plugin is
    # disabled (DISABLE_SECURITY_PLUGIN), so publishing 9200 would expose an
    # unauthenticated OpenSearch to every host that can reach this machine.
    # fess01 reaches it over docsearch_net; for local inspection use
    # `docker compose exec search01 curl http://localhost:9200/...`.
    networks:
      - docsearch_net

networks:
  docsearch_net:
    driver: bridge
